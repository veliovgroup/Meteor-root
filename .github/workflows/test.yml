name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-types:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript type tests
        run: npm run test:types

  test-meteor:
    name: Meteor ${{ matrix.meteor }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        meteor:
          - '2.14'
          - '2.15'
          - '2.16'
          - '3.2'
          - '3.3.1'
          - '3.4.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Meteor ${{ matrix.meteor }}
        uses: meteorengineer/setup-meteor@v2
        with:
          meteor-release: ${{ matrix.meteor }}

      - name: Install mtest
        run: npm i -g @zodern/mtest

      - name: Run package tests
        run: mtest --package ./ --once --release ${{ matrix.meteor }}
